# Only modules listed are active.
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory

# Explicit JDBC driver registration for MS SQL Server
driverlist=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Reload properties dynamically if changed on disk
reloadproperties=true

# Immediately flush intercepted statements to the logger
autoflush=true

# Route SQL logs directly to Log4j2 via SLF4J (logger name: "p6spy")
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Compact single-line output without redundant timestamp (Log4j2 already adds timestamp)
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms|%(category)|conn%(connectionId)|%(sqlSingleLine)

# Filter SQL statements: log only data mutations (INSERT, UPDATE, MERGE)
filter=true
include=insert,update,merge

# Exclude noisy read/metadata categories while keeping 'statement' and 'batch'
excludecategories=info,debug,result,resultset,commit,rollback
